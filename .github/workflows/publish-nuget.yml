name: Publish NuGet Package

on:
  release:
    types: [published] # Triggers when you publish a new GitHub Release

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # Necessary to push to GitHub Packages

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' # Change this if your project uses .NET 9 or another version

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --configuration Release --no-restore

      - name: Pack project into NuGet package
        run: |
          dotnet pack --configuration Release --no-build \
            -p:PackageVersion=${{ github.event.release.tag_name }} \
            --output ./nupkgs

      - name: Publish NuGet package to GitHub Packages
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --source "https://nuget.pkg.github.com/pi-40/index.json" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate
